name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create Fake Env File
        run: echo "GEMINI_API_KEY=fake_key_for_building" > .env

      - name: Make Gradlew Executable
        run: |
          if [ -f "./gradlew" ]; then chmod +x ./gradlew;
          elif [ -f "./gradle/gradlew" ]; then chmod +x ./gradle/gradlew;
          fi

      - name: Build APK
        run: |
          if [ -f "./gradlew" ]; then ./gradlew assembleDebug;
          elif [ -f "./gradle/gradlew" ]; then ./gradle/gradlew assembleDebug;
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-ai-app
          path: "**/build/outputs/apk/debug/*.apk"
